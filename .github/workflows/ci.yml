name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    # Migration ve rol kurulumunun gerçekten koştuğunu doğrulamak için
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piravel
          POSTGRES_PASSWORD: piravel
          POSTGRES_DB: piravel_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piravel -d piravel_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_ADMIN_URL: postgres://piravel:piravel@localhost:5432/piravel_os
      # ⚠ APP_DB_PASSWORD ve DATABASE_URL BURADA TANIMLANMAZ.
      #
      # Eskiden ikisi de `piravel_app` sabitiydi — yani rol adının kendisi.
      # `src/lib/env.ts` ve `setup-db-roles.mjs` artık bilinen placeholder ve
      # zayıf değerleri reddediyor ve bu adım haklı olarak düştü. Değer koşu
      # başına üretilir (aşağıdaki adım); job seviyesinde tanımlanırsa
      # $GITHUB_ENV ile üretilen değeri ezerdi.
      # Uçtan uca kontroller koşu-kapsamlı audit sorgularına dayanır. Kapı
      # NODE_ENV'e değil bu bayrağa bağlı olduğu için testler GERÇEK production
      # sunucusuna karşı koşabilir. Üretim ortamında ASLA set edilmez.
      AUDIT_TEST_RUN_ID_ENABLED: "1"
      # Doğrulama script'leri farklı istemcileri x-forwarded-for ile simüle
      # eder; tek "proxy" bu script'tir. Üretimde gerçek proxy sayısı yazılır.
      TRUSTED_PROXY_HOPS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # BETTER_AUTH_SECRET'in kodda varsayılanı YOKTUR (src/lib/env.ts): eksikse
      # uygulama bilerek başlamaz. Değer koşu başına üretilir ve depoya yazılmaz —
      # workflow dosyasına sabit bir sır gömmek, onu herkese açık hâle getirirdi.
      - name: Koşuya özel sırlar ve DB parolası üret
        run: |
          echo "BETTER_AUTH_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"
          echo "INVITE_TOKEN_PEPPER=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"
          # Rol parolası da koşuya özel: base64url URL-güvenlidir, bağlantı
          # dizesine kaçış gerektirmeden gömülür. DATABASE_URL aynı adımda
          # yazılır — parola iki yerde yaşıyor, biri unutulursa uygulama açılmaz.
          APP_DB_PASSWORD="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          echo "APP_DB_PASSWORD=$APP_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://piravel_app:$APP_DB_PASSWORD@localhost:5432/piravel_os" >> "$GITHUB_ENV"

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Birim testleri
        run: npm test

      - name: Migration'lar (şema v1.2)
        run: npm run db:migrate

      - name: Migration idempotency (ikinci çalıştırma değişiklik üretmemeli)
        run: npm run db:migrate

      - name: Uygulama DB rolü + audit_logs yetkileri
        run: npm run db:roles

      - name: Audit_logs değiştirilemezliği (rol + trigger)
        run: npm run db:verify-audit

      # Migration'ın "hatasız koştu" demesi yetmez: DROP INDEX sessizce hiçbir
      # şey düşürmemiş, bir FK CASCADE kalmış ya da CHECK hiç eklenmemiş
      # olabilir. Bu adım ÜRETİLEN YAPIYA bakar ve temiz veritabanında koşar.
      - name: Şema yapısı (tablo · kısıt · index · trigger · pg_trgm)
        run: npm run verify:schema

      - name: Production build
        run: npm run build

      # ── Uçtan uca kimlik doğrulama ve giriş güvenliği ──
      # Gerçek HTTP istekleriyle çalışır; production sunucusu ayağa kaldırılır.
      - name: Test kullanıcılarını oluştur
        env:
          ADMIN_PASSWORD: gelistirme-test-parolasi
        run: |
          npm run seed:admin -- --email admin@example.com --name "Test Yonetici"
          npm run seed:admin -- --email finance@example.com --name "Test finance" --role finance
          npm run seed:admin -- --email operations@example.com --name "Test operations" --role operations
          npm run seed:admin -- --email member@example.com --name "Test member" --role member

      - name: Uygulamayı başlat
        run: npm run start &
        env:
          BETTER_AUTH_URL: http://localhost:3000

      - name: Sunucunun hazır olmasını bekle
        run: npx --yes wait-on http://localhost:3000/giris --timeout 60000

      - name: Kimlik doğrulama akışı (28 kontrol)
        run: npm run verify:auth

      - name: Giriş güvenliği — rate limit ve hesap kilidi (28 kontrol)
        run: npm run verify:lockout

      - name: Adım yükseltme (step-up)
        run: npm run verify:stepup

      - name: Kullanıcı yönetimi ve davet akışı
        run: npm run verify:users

      - name: Oturum listesi ve iptali
        run: npm run verify:sessions

      - name: Marka modülü — yetki, kapsam, CSV, soft delete, eşzamanlılık
        run: npm run verify:brands

      - name: Sözleşme modülü — numara, tutar temeli, ödeme planı, hizmet bağlama
        run: npm run verify:contracts

      # verify:a11y gerçek bir tarayıcıda klavye ve odak davranışını sınar;
      # pipeline'daki ilk Playwright adımı olduğu için tarayıcı burada kurulur.
      # Yalnız chromium: diğer motorlar bu testler için gereksiz indirme olurdu.
      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: Mobil drawer erişilebilirliği
        run: npm run verify:a11y

      # Üretim derlemesine karşı koşar: styleguide'ın KAPALI olduğunu doğrular.
      - name: Styleguide üretimde kapalı
        run: npm run verify:styleguide
