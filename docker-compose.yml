services:
  postgres:
    image: postgres:16
    container_name: piravel-pg
    environment:
      POSTGRES_USER: piravel
      POSTGRES_PASSWORD: piravel
      POSTGRES_DB: piravel_os
    ports:
      - "5432:5432"
    volumes:
      - piravel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piravel -d piravel_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  piravel-pgdata:
